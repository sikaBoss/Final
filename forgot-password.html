<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password - Channel</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</head><body>
<header class="topnav">
  <a class="logo" href="index.html">CHAN<span>NEL</span></a>
  <nav class="nav" id="navMenu">
    <a href="index.html" class="">Home</a>
    <a href="marketplace.html" class="">Marketplace</a>
    <a href="account.html" class="">Account</a>
    <a href="login.html" class="active" id="loginLink">Login</a>
  </nav>
  <button class="hamburger" id="hamburger">☰</button>
</header>

<div class="form card">
  <h2>Forgot password</h2>
  <p class="muted" style="margin-top:6px">Enter the email on your account and your current account balance</p>

  <div id="step1">
    <label class="label">Email</label><input id="email" class="input" type="email">
    <label class="label">Account balance (GHC)</label><input id="balance" class="input" type="number" step="0.01" placeholder="e.g. 120.00">
    <button id="verifyBtn" class="btn btn-pink" style="width:100%;margin-top:18px">Verify</button>
  </div>

  <div id="step2" style="display:none">
    <label class="label">New password</label><input id="newPassword" class="input" type="password" minlength="6">
    <label class="label">Confirm new password</label><input id="confirmPassword" class="input" type="password" minlength="6">
    <button id="resetBtn" class="btn btn-pink" style="width:100%;margin-top:18px">Update password</button>
  </div>

  <p id="msg" class="muted" style="margin-top:10px"></p>
  <p class="muted" style="margin-top:14px">Remembered it? <a href="login.html" style="color:var(--pink-deep);font-weight:700">Back to login</a></p>
</div>

<script>
let verifiedEmail = null;
let verifiedBalance = null;

document.getElementById('verifyBtn').addEventListener('click', async()=>{
  const btn=document.getElementById('verifyBtn');
  const email=document.getElementById('email').value.trim();
  const balance=document.getElementById('balance').value;
  const msg=document.getElementById('msg');
  msg.textContent='';
  if(!email || balance===''){ msg.textContent='Enter your email and current balance.'; return; }
  btn.disabled=true; btn.textContent='Verifying...';
  try{
    await Store.verifyPasswordReset(email, balance);
    verifiedEmail = email;
    verifiedBalance = balance;
    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';
    toast('Verified — set your new password');
  }catch(e){ msg.textContent=e.message; toast(e.message); }
  finally{ btn.disabled=false; btn.textContent='Verify'; }
});

document.getElementById('resetBtn').addEventListener('click', async()=>{
  const btn=document.getElementById('resetBtn');
  const p1=document.getElementById('newPassword').value;
  const p2=document.getElementById('confirmPassword').value;
  const msg=document.getElementById('msg');
  msg.textContent='';
  if(p1.length<6){ msg.textContent='Password must be at least 6 characters.'; return; }
  if(p1!==p2){ msg.textContent='Passwords do not match.'; return; }
  btn.disabled=true; btn.textContent='Updating...';
  try{
    await Store.resetPasswordByBalance(verifiedEmail, verifiedBalance, p1);
    toast('Password updated — please log in');
    document.getElementById('step2').style.display='none';
    msg.textContent='Password updated. Redirecting to login...';
    setTimeout(()=>{ location.href='login.html'; }, 1200);
  }catch(e){ msg.textContent=e.message; toast(e.message); }
  finally{ btn.disabled=false; btn.textContent='Update password'; }
});
</script>

<script>
document.getElementById('hamburger')?.addEventListener('click', ()=>{document.getElementById('navMenu').classList.toggle('open')});
(async()=>{
  const u=await Store.getCurrentUser().catch(()=>null);
  if(u){ const l=document.getElementById('loginLink'); if(l){ l.textContent='Logout'; l.href='#'; l.onclick=async(e)=>{e.preventDefault(); await Store.logout(); location.href='index.html';} } }
})();
</script>
</body></html>
